# E2E test setup for Launchpad

services:
  # MinIO for ObjectStore (S3-compatible)
  minio:
    image: minio/minio:latest
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - minio-data:/data
    networks:
      - launchpad-e2e

  # Mock Sentry API server
  mock-sentry-api:
    build:
      context: .
      dockerfile: tests/e2e/mock-sentry-api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - mock-api-data:/app/data
    networks:
      - launchpad-e2e

  # Launchpad service
  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TEST_BUILD: "true"
    environment:
      PYTHONUNBUFFERED: "1"
      LAUNCHPAD_ENV: "e2e-test"
      SENTRY_BASE_URL: "http://mock-sentry-api:8000"
      OBJECTSTORE_URL: "http://minio:9000"
      LAUNCHPAD_RPC_SHARED_SECRET: "test-secret-key-for-e2e"
      LAUNCHPAD_WORKER_RPC_HOST: "host.docker.internal:50051"
      LAUNCHPAD_WORKER_CONCURRENCY: "1"
      SENTRY_DSN: ""
    depends_on:
      mock-sentry-api:
        condition: service_healthy
    extra_hosts:
      host.docker.internal: host-gateway
    networks:
      - launchpad-e2e

  # Test orchestrator
  e2e-tests:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.test-runner
    environment:
      MOCK_API_URL: "http://mock-sentry-api:8000"
      LAUNCHPAD_URL: "http://launchpad:2218"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      LAUNCHPAD_RPC_SHARED_SECRET: "test-secret-key-for-e2e"
    depends_on:
      mock-sentry-api:
        condition: service_healthy
    volumes:
      - ./tests/e2e/results:/app/results
    command: pytest e2e_tests/test_e2e_flow.py -v --tb=short
    networks:
      - launchpad-e2e

volumes:
  minio-data:
  mock-api-data:

networks:
  launchpad-e2e:
    name: launchpad-e2e
