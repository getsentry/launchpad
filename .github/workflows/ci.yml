name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on all PRs, not just those targeting main
    # This enables CI for stacked PRs

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: make install-dev

      - name: Check lint
        run: make check-lint

      - name: Check format
        run: make check-format

      - name: Check types
        run: make check-types

      - name: Check deps
        run: make check-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: make install-dev

      - name: Build Docker image with test fixtures
        run: docker build --build-arg TEST_BUILD=true -t launchpad-test .

      - name: Run all tests in Docker
        run: |
          docker run --rm \
            -e LAUNCHPAD_ENV=development \
            -e LAUNCHPAD_RPC_SHARED_SECRET="launchpad-test-secret" \
            --entrypoint python launchpad-test -m pytest -n auto tests/ --ignore=tests/e2e -v

      - name: Test CLI installation and basic functionality in Docker
        run: |
          docker run --rm \
            -e LAUNCHPAD_ENV=development \
            launchpad-test --help

  build:
    runs-on: ubuntu-latest
    needs: [check, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: make install-dev

      - name: Build package
        run: make build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          # Create a fresh venv for testing the wheel installation
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl
          # Install dependencies that the package needs
          test-venv/bin/pip install -r requirements.txt
          test-venv/bin/launchpad --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7
