name: Sentry Dogfooding

on:
  pull_request:
    paths: [src/**, .github/workflows/sentry_dogfood.yml]
  push:
    branches: [main]
    paths: [src/**, .github/workflows/sentry_dogfood.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Sentry CLI
        run: |
          curl -L -o sentry-cli https://github.com/getsentry/sentry-cli/releases/download/2.53.0-alpha/sentry-cli-Darwin-universal
          chmod +x sentry-cli
          sudo mv sentry-cli /usr/local/bin/

      - name: Unzip iOS app
        run: |
          unzip -o ./tests/_fixtures/ios/HackerNews_without_parsedassets.xcarchive.zip
          EXTRACTED_PATH=$(find . -name "*.xcarchive" -type d | head -1)
          mv "$EXTRACTED_PATH" ./HackerNews.xcarchive

      - name: Upload iOS app to Sentry
        env:
          # Environment variables for pull_request context
          HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO_NAME_PR: ${{ github.repository }}
          BASE_REPO_NAME_PR: ${{ github.repository }}
          HEAD_REF_PR: ${{ github.head_ref }}
          BASE_REF_PR: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
          # Environment variables for push context
          HEAD_SHA_PUSH: ${{ github.sha }}
          HEAD_REPO_NAME_PUSH: ${{ github.repository }}
          HEAD_REF_PUSH: ${{ github.ref_name }}
          # Event name for conditional logic
          EVENT_NAME: ${{ github.event_name }}
          # Secret token
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            sentry-cli \
             --log-level=debug \
             --auth-token "$SENTRY_AUTH_TOKEN" \
             build \
             upload \
             ./HackerNews.xcarchive \
             --org sentry \
             --project launchpad-test-ios \
             --head-sha "$HEAD_SHA_PR" \
             --base-sha "$BASE_SHA_PR" \
             --vcs-provider github \
             --head-repo-name "$HEAD_REPO_NAME_PR" \
             --base-repo-name "$BASE_REPO_NAME_PR" \
             --head-ref "$HEAD_REF_PR" \
             --base-ref "$BASE_REF_PR" \
             --pr-number "$PR_NUMBER" \
             --build-configuration Release
          else
            sentry-cli \
             --log-level=debug \
             --auth-token "$SENTRY_AUTH_TOKEN" \
             build \
             upload \
             ./HackerNews.xcarchive \
             --org sentry \
             --project launchpad-test-ios \
             --head-sha "$HEAD_SHA_PUSH" \
             --vcs-provider github \
             --head-repo-name "$HEAD_REPO_NAME_PUSH" \
             --head-ref "$HEAD_REF_PUSH" \
             --build-configuration Release
          fi

      - name: Upload Android app to Sentry
        env:
          # Environment variables for pull_request context
          HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO_NAME_PR: ${{ github.repository }}
          BASE_REPO_NAME_PR: ${{ github.repository }}
          HEAD_REF_PR: ${{ github.head_ref }}
          BASE_REF_PR: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
          # Environment variables for push context
          HEAD_SHA_PUSH: ${{ github.sha }}
          HEAD_REPO_NAME_PUSH: ${{ github.repository }}
          HEAD_REF_PUSH: ${{ github.ref_name }}
          # Event name for conditional logic
          EVENT_NAME: ${{ github.event_name }}
          # Secret token
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            sentry-cli \
             --log-level=debug \
             --auth-token "$SENTRY_AUTH_TOKEN" \
             build \
             upload \
             ./tests/_fixtures/android/hn.aab \
             --org sentry \
             --project launchpad-test-android \
             --head-sha "$HEAD_SHA_PR" \
             --base-sha "$BASE_SHA_PR" \
             --vcs-provider github \
             --head-repo-name "$HEAD_REPO_NAME_PR" \
             --base-repo-name "$BASE_REPO_NAME_PR" \
             --head-ref "$HEAD_REF_PR" \
             --base-ref "$BASE_REF_PR" \
             --pr-number "$PR_NUMBER" \
             --build-configuration Release
          else
            sentry-cli \
             --log-level=debug \
             --auth-token "$SENTRY_AUTH_TOKEN" \
             build \
             upload \
             ./tests/_fixtures/android/hn.aab \
             --org sentry \
             --project launchpad-test-android \
             --head-sha "$HEAD_SHA_PUSH" \
             --vcs-provider github \
             --head-repo-name "$HEAD_REPO_NAME_PUSH" \
             --head-ref "$HEAD_REF_PUSH" \
             --build-configuration Release
          fi
