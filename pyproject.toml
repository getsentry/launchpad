[build-system]
requires = ["setuptools>=61.0.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad"
version = "1.0.0"
description = "CLI tool for analyzing iOS and Android app bundle sizes"
readme = "README.md"
# Update to "FSL-1.1-ALv2" once the next version of SPDX comes out,
# see: https://github.com/spdx/license-list-XML/issues/2459
license-files = ["LICENSE"]
authors = [
    {name = "Sentry Team", email = "engineering@sentry.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "asn1crypto>=1.5.0",
    "click>=8.1.0",
    "confluent-kafka>=2.13.2",
    "cryptography>=45.0.7",
    "datadog==0.52.1",
    "lief==0.17.2",
    "lzfse>=0.4.2",
    "objectstore-client>=0.1.0",
    "pillow>=11.3.0",
    "pillow_heif>=1.1.0",
    "protobuf>=5.29.5,<6",
    "pydantic>=2.10.0,<3",
    "pyyaml>=6.0",
    "rich>=14.1.0",
    "sentry-arroyo>=2.38.7",
    "sentry-sdk>=2.36.0",
    "sortedcontainers>=2.4.0",
    "taskbroker-client>=0.20.1,<1",
    "typing-extensions>=4.15.0",
    "zipfile-zstd==0.0.4",
]

[dependency-groups]
dev = [
    "devservices>=1.2.1",
    "bandit>=1.7.0",
    "debugpy>=1.8.16",
    "memray>=1.0.0",
    "pip-audit>=2.6.0",
    "pre-commit>=4.3.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.15.0",
    "pytest-verbose-parametrize>=1.7.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.1.0",
    "pytest>=8.4.2",
    "responses>=0.25.8",
    "ruff==0.15.0",
    "safety>=3.6.1",
    "ty==0.0.1a20",
    "sortedcontainers-stubs>=2.4.0",
    "sentry-protos>=0.4.11",
]
e2e = [
    "pytest>=8.3.3",
    "requests>=2.32.3",
    "boto3>=1.35.0",
]

[project.scripts]
launchpad = "launchpad.cli:main"

[project.urls]
Repository = "https://github.com/getsentry/launchpad"
Issues = "https://github.com/getsentry/launchpad/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) by default
select = ["E", "F", "I"]
ignore = ["E501", "E731"]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "PLR2004"]
"src/launchpad/artifacts/android/resources/protos/**/*" = ["E", "F", "I", "N", "UP", "ARG", "SIM", "TCH", "TID", "Q", "RSE", "RET", "SLF", "SLOT", "PIE", "T20", "PYI", "PT", "YTT", "BLE", "FBT", "A", "COM", "C90", "DTZ", "ISC", "G", "INP", "PTH", "AIR", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "S"]

[tool.ty.src]
include = ["src/"]
exclude = ["src/launchpad/artifacts/android/resources/protos/**/*"]
respect-ignore-files = true

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=auto",
    "--maxfail=10",
    "--durations=10",
    "--color=yes",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "cli: CLI functionality tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
