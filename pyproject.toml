[build-system]
requires = ["uv_build==0.8.2"]
build-backend = "uv_build"

[project]
name = "launchpad"
version = "1.0.0"
description = "CLI tool for analyzing iOS and Android app bundle sizes"
readme = "README.md"
# Update to "FSL-1.1-ALv2" once the next version of SPDX comes out,
# see: https://github.com/spdx/license-list-XML/issues/2459
license-files = ["LICENSE"]
authors = [
    {name = "Sentry Team", email = "engineering@sentry.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.11"

dependencies = [
  "aiohttp>=3.12.15",
  "asn1crypto>=1.5.0",
  "build>=1.3.0",
  "click>=8.1.0",
  "confluent-kafka>=2.9.0,<2.10.0",
  "cryptography>=45.0.7",
  "datadog==0.52.1",
  "google-api-core==2.25.1",
  "google-api-python-client==2.181.0",
  "lief==0.16.6",
  "lzfse>=0.4.2",
  "pillow>=11.3.0",
  "pillow_heif>=1.1.0",
  "protobuf>=5.29.5,<6",
  "pydantic>=2.9.2,<2.10.0",
  "rich>=14.1.0",
  "sentry-arroyo==2.29.2",
  "sentry-kafka-schemas==2.1.2",
  "sentry-sdk>=2.36.0",
  "sortedcontainers>=2.4.0",
  "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
  "devservices>=1.2.1",
  "bandit>=1.7.0",
  "debugpy>=1.8.16",
  "memray>=1.0.0",
  "pip-audit>=2.6.0",
  "pre-commit>=4.3.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "pytest-mock>=3.15.0",
  "pytest-verbose-parametrize>=1.7.0",
  "pytest-xdist>=3.8.0",
  "pytest>=8.4.2",
  "responses>=0.25.8",
  "ruff>=0.12.12",
  "safety>=3.6.1",
  "ty==0.0.1a20",
  "sortedcontainers-stubs>=2.4.0",
  "kafka-python>=2.0.0",
  "sentry-protos==0.2.0",
]

[tool.uv]
# Don't try and solve for Windows
environments = ["sys_platform == 'darwin' or sys_platform == 'linux'"]

# TODO(EME-213): We should use the Sentry pypi instance by uncommenting
# the below but first we need to check it contains all the deps we
# need.
# [[tool.uv.index]]
# url = "https://pypi.devinfra.sentry.io/simple"
# default = true

[project.scripts]
launchpad = "launchpad.cli:main"

[project.urls]
Repository = "https://github.com/getsentry/launchpad"
Issues = "https://github.com/getsentry/launchpad/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) by default
select = ["E", "F", "I"]
ignore = ["E501", "E731"]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "PLR2004"]
"src/launchpad/artifacts/android/resources/protos/**/*" = ["E", "F", "I", "N", "UP", "ARG", "SIM", "TCH", "TID", "Q", "RSE", "RET", "SLF", "SLOT", "PIE", "T20", "PYI", "PT", "YTT", "BLE", "FBT", "A", "COM", "C90", "DTZ", "ISC", "G", "INP", "PTH", "AIR", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "S"]

[tool.ty.src]
include = ["src/"]
exclude = ["src/launchpad/artifacts/android/resources/protos/**/*"]
respect-ignore-files = true

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=auto",
    "--maxfail=10",
    "--durations=10",
    "--color=yes",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "cli: CLI functionality tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
